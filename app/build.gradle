plugins {
    id "com.android.application"
}

android {
    namespace "com.fm1.midibridge"  // the code's package (it grew out of MIDI Bridge)
    compileSdk 34

    defaultConfig {
        applicationId "com.pfkellogg.synthspyglass"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    // Release builds are signed with the key named in ../keystore.properties (kept out of git;
    // the same key every time, so a new version installs over the old one).
    def keys = new Properties()
    def keysFile = rootProject.file("keystore.properties")
    if (keysFile.exists()) keysFile.withInputStream { keys.load(it) }
    signingConfigs {
        release {
            if (keys.storeFile) {
                storeFile file(keys.storeFile)
                storePassword keys.storePassword
                keyAlias keys.keyAlias
                keyPassword keys.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig keys.storeFile ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
